---
- name: Check the required variables
  ansible.builtin.assert:
    that:
      - traefik_dashboard_password | length > 0
      - traefik_acme_email | length > 0
    fail_msg: Set traefik_dashboard_password (vault) and traefik_acme_email.
    quiet: true

- name: Create the project directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ traefik_dir }}"
    - "{{ traefik_dir }}/config"

# Created up front: otherwise Docker creates a directory for the bind mount and
# Traefik skips the resolver ("permissions 755 for acme.json are too open").
- name: Create acme.json with mode 600
  ansible.builtin.file:
    path: "{{ traefik_dir }}/config/acme.json"
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: Write the TransIP private key
  ansible.builtin.copy:
    content: "{{ traefik_transip_private_key }}"
    dest: "{{ traefik_dir }}/config/transip.key"
    owner: root
    group: root
    mode: "0600"
  when: traefik_transip_private_key | length > 0
  no_log: true
  notify: Restart traefik

- name: Write config/traefik.yml
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_dir }}/config/traefik.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart traefik

# Same as `htpasswd -nb admin securepassword` (apr1), with a salt derived from the
# password so the hash, and the container labels, stay the same between runs.
- name: Hash the dashboard password
  ansible.builtin.command:
    argv:
      - openssl
      - passwd
      - -apr1
      - -salt
      - "{{ (traefik_dashboard_user ~ ':' ~ traefik_dashboard_password) | hash('sha256') | truncate(8, True, '') }}"
      - "{{ traefik_dashboard_password }}"
  register: traefik_dashboard_hash
  changed_when: false
  no_log: true

- name: Write docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ traefik_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Start Traefik
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_dir }}"
    state: present
