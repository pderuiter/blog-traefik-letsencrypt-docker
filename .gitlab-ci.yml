---
# Self-contained lint pipeline for this companion repo.
stages:
  - lint

variables:
  ANSIBLE_CONFIG: "$CI_PROJECT_DIR/ansible/ansible.cfg"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

lint:ansible:
  stage: lint
  image: python:3.12-slim
  cache:
    paths:
      - .cache/pip
  before_script:
    - pip install --quiet "ansible==9.13.0" "ansible-lint==24.12.2" "yamllint==1.35.1"
    - ansible-galaxy collection install -r ansible/requirements.yml
  script:
    - yamllint .
    - ansible-lint

lint:terraform:
  stage: lint
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  script:
    - terraform -chdir=terraform fmt -check -recursive
    - terraform -chdir=terraform init -backend=false -input=false
    - terraform -chdir=terraform validate

lint:tflint:
  stage: lint
  image:
    name: ghcr.io/terraform-linters/tflint:v0.61.0
    entrypoint: [""]
  script:
    - cd terraform
    - tflint --init
    - tflint
